name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, lint, and format check
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            cargo build --verbose
            cargo clippy -- -D warnings
            cargo fmt -- --check
